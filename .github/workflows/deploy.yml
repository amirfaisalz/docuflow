name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME || 'docuflow' }}
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  images:
    name: Build ${{ matrix.service }}
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: true
      matrix:
        service: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "registry=${registry}" >> "$GITHUB_OUTPUT"
          echo "image=${registry}/${PROJECT_NAME}/${{ matrix.service }}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.image }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Migrate and deploy
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "prefix=${registry}/${PROJECT_NAME}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Run database migrations
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'docuflow-cluster' }}
          MIGRATION_TASK_DEFINITION: ${{ vars.MIGRATION_TASK_DEFINITION }}
          CONTAINER_IMAGE: ${{ steps.ecr.outputs.prefix }}/api:${{ env.IMAGE_TAG }}
          ECS_SUBNETS: ${{ vars.ECS_SUBNETS }}
          ECS_SECURITY_GROUPS: ${{ vars.ECS_SECURITY_GROUPS }}
        run: bash .github/scripts/migrate.sh
      - name: Deploy ECS services with automatic rollback
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'docuflow-cluster' }}
          CONTAINER_IMAGE_PREFIX: ${{ steps.ecr.outputs.prefix }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          HEALTH_CHECK_URL: ${{ vars.HEALTH_CHECK_URL }}
          API_SERVICE_NAME: ${{ vars.API_SERVICE_NAME || 'docuflow-api' }}
          WORKER_SERVICE_NAME: ${{ vars.WORKER_SERVICE_NAME || 'docuflow-worker' }}
          WEB_SERVICE_NAME: ${{ vars.WEB_SERVICE_NAME || 'docuflow-web' }}
        run: bash .github/scripts/deploy.sh
      - name: Deployment summary
        run: |
          {
            echo "### DocuFlow deployment"
            echo ""
            echo "- Image tag: \`${IMAGE_TAG}\`"
            echo "- Cluster: \`${{ vars.ECS_CLUSTER || 'docuflow-cluster' }}\`"
            echo "- Health check: \`${{ vars.HEALTH_CHECK_URL }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
